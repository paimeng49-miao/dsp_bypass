name: Build dsp_bypass KPM

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install basic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git wget xz-utils

      - name: Download ARM GNU Toolchain
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -xf arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-elf.tar.xz
          echo "$PWD/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-elf/bin" >> $GITHUB_PATH

      - name: Clone KernelPatch
        run: |
          git clone --depth 1 --branch 0.13.5 https://github.com/bmax121/KernelPatch.git /home/runner/KernelPatch

      - name: Fix Makefile CC and Patch Source for Kernel 6.6
        run: |
          # 1. 修正 Makefile 编译器
          sed -i 's|^CC :=.*|CC = aarch64-none-elf-gcc|' Makefile
          
          # 2. 强制修正 dsp_bypass.c 里的 ABI 探测逻辑，直接适配6.6内核
          sed -i 's|has_state = .*|has_state = 0; /* FORCE 6.6 ABI */|' dsp_bypass.c
          
          # 3. 打印确认修改成功
          grep -n "has_state" dsp_bypass.c
          
          # 4. 重新编译
          make -j$(nproc)

      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsp_bypass-kpm
          path: "*.kpm"

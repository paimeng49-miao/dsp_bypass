name: Build dsp_bypass KPM

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make git

      - name: Clone KernelPatch
        run: |
          # 克隆到 Makefile 默认的路径 $HOME/KernelPatch
          git clone --depth 1 https://github.com/bmax121/KernelPatch.git /home/runner/KernelPatch

      - name: Fix Makefile CC and Build KPM
        run: |
          # 把 Makefile 里那一行 CC := ... 强行替换成标准 GCC
          sed -i 's|^CC :=.*|CC = aarch64-linux-gnu-gcc|' Makefile
          
          # 打印出来确认一下替换成功没
          grep -n "^CC" Makefile
          
          # 编译
          make -j$(nproc)

      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsp_bypass-kpm
          path: "*.kpm"
